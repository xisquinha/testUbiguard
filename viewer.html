<!DOCTYPE html>
<html>
<head>
    <title>Viewer Node</title>
</head>
<body>
  <h2>Viewer Status: <p id="status">A aguardar alarme...</p></h2>
  <video id="remoteVideo" autoplay playsinline style="width:100%; max-width: 500px; display:none; border: 2px solid green;"></video>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

  const app = initializeApp({ 
    apiKey: "AIzaSyA9RU8Z1RZ_fAsKVW6nWXy-Qyz9qwXipFo",
    databaseURL: "https://esp-project-adbef-default-rtdb.europe-west1.firebasedatabase.app/"
  });
  const db = getDatabase(app);
  const ALARM_UID = "alarm_3076F5F04D70"; 

  const status = document.getElementById('status');
  const remoteVideo = document.getElementById('remoteVideo');
  const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  let pc = null;

  async function connectToStream(offer) {
    status.textContent = "🔗 A ligar ao stream...";
    pc = new RTCPeerConnection(servers);

    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.style.display = 'block';
      status.textContent = "🔴 Ao vivo";
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        push(ref(db, `/alarms/${ALARM_UID}/webrtc/viewerCandidates`), event.candidate.toJSON());
      }
    };

    await pc.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    
    await set(ref(db, `/alarms/${ALARM_UID}/webrtc/answer`), {
      type: answer.type,
      sdp: answer.sdp
    });

    // Listen for streaming incoming connection tokens
    onChildAdded(ref(db, `/alarms/${ALARM_UID}/webrtc/callerCandidates`), (snapshot) => {
      if (snapshot.val()) {
        pc.addIceCandidate(new RTCIceCandidate(snapshot.val()));
      }
    });
  }

  // Handle stream orchestration
  onValue(ref(db, `/alarms/${ALARM_UID}/webrtc/offer`), (snapshot) => {
    if (snapshot.val() && !pc) {
      connectToStream(snapshot.val());
    }
  });

  onValue(ref(db, `/alarms/${ALARM_UID}/isFired`), (snapshot) => {
    if (!snapshot.val()) {
      if (pc) { pc.close(); pc = null; }
      remoteVideo.style.display = 'none';
      status.textContent = "A aguardar alarme...";
    }
  });
</script>
</body>
</html>
