<!DOCTYPE html>
<html>
<body>
  <p id="status">A aguardar alarme...</p>
  <video id="localVideo" autoplay playsinline muted style="width:100%"></video>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyCgQ5-OmUPRlFlopVW7nrqnwSy5xcNmqdk",
    databaseURL: "https://ubiguard-sim-default-rtdb.europe-west1.firebasedatabase.app/"
  });
  const db = getDatabase(app);
  const ALARM_UID = "alarm_3076F5F04D70"; // ← change this

  const status = document.getElementById('status');
  const localVideo = document.getElementById('localVideo');

  const servers = {
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  };

  let pc = null;
  let localStream = null;

  async function startStreaming() {
    status.textContent = "📷 A ligar câmara...";
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    localVideo.srcObject = localStream;

    pc = new RTCPeerConnection(servers);
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        push(ref(db, `/alarms/${ALARM_UID}/webrtc/callerCandidates`), event.candidate.toJSON());
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await set(ref(db, `/alarms/${ALARM_UID}/webrtc/offer`), {
      type: offer.type,
      sdp: offer.sdp
    });

    status.textContent = "⏳ A aguardar que o utilizador se ligue...";

    onValue(ref(db, `/alarms/${ALARM_UID}/webrtc/answer`), async (snapshot) => {
      if (snapshot.val() && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(snapshot.val()));
        status.textContent = "🔴 A transmitir ao vivo!";
      }
    });

    onValue(ref(db, `/alarms/${ALARM_UID}/webrtc/viewerCandidates`), (snapshot) => {
      snapshot.forEach(child => {
        pc.addIceCandidate(new RTCIceCandidate(child.val()));
      });
    });
  }

  function stopStreaming() {
    if (pc) { pc.close(); pc = null; }
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    set(ref(db, `/alarms/${ALARM_UID}/webrtc`), null);
    status.textContent = "A aguardar alarme...";
  }

  let streaming = false;
  onValue(ref(db, `/alarms/${ALARM_UID}/isFired`), (snapshot) => {
    const fired = snapshot.val();
    if (fired && !streaming) { streaming = true; startStreaming(); }
    else if (!fired && streaming) { streaming = false; stopStreaming(); }
  });
</script>
</body>
</html>
