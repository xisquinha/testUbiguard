<!DOCTYPE html>
<html>
<head>
    <title>Security Camera Node</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <h2>Status: <span id="status">Waiting...</span></h2>
    <video id="myVideo" autoplay muted playsinline style="width: 300px; border: 2px solid red;"></video>

    <script>
        const peer = new Peer('security-cam-123'); // Give your camera a unique ID
        const videoElement = document.getElementById('myVideo');

        // 1. Get Camera Stream
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            videoElement.srcObject = stream;

            // 2. Wait for the Viewer to call
            peer.on('call', call => {
                document.getElementById('status').innerText = "Streaming Live!";
                call.answer(stream); // Send our video to the viewer
            });
        });

        peer.on('open', id => console.log('Camera ready with ID: ' + id));
    </script>
</body>
</html>
