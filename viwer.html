<!DOCTYPE html>
<html>
<body>
  <p id="status">A aguardar alarme...</p>
  <video id="remoteVideo" autoplay playsinline style="width:100%; display:none"></video>

<script type="module">
  // --- paste shared signaling helper here ---

  const status = document.getElementById('status');
  const remoteVideo = document.getElementById('remoteVideo');

  const servers = {
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  };

  let pc = null;

  async function connectToStream(offer) {
    status.textContent = "🔗 A ligar ao stream...";

    // 1. Create connection and listen for incoming video track
    pc = new RTCPeerConnection(servers);
    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      remoteVideo.style.display = 'block';
      status.textContent = "🔴 Ao vivo";
    };

    // 2. Send our ICE candidates to Firebase
    pc.onicecandidate = (event) => {
      if (event.candidate) {
        push(ref(db, `/alarms/${ALARM_UID}/webrtc/viewerCandidates`),
          event.candidate.toJSON());
      }
    };

    // 3. Accept the offer from the camera phone
    await pc.setRemoteDescription(new RTCSessionDescription(offer));

    // 4. Create and send back our answer
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await set(ref(db, `/alarms/${ALARM_UID}/webrtc/answer`), {
      type: answer.type,
      sdp: answer.sdp
    });

    // 5. Listen for camera phone's ICE candidates
    onValue(ref(db, `/alarms/${ALARM_UID}/webrtc/callerCandidates`), (snapshot) => {
      snapshot.forEach(child => {
        pc.addIceCandidate(new RTCIceCandidate(child.val()));
      });
    });
  }

  // Watch for an offer appearing in Firebase
  onValue(ref(db, `/alarms/${ALARM_UID}/webrtc/offer`), (snapshot) => {
    if (snapshot.val() && !pc) {
      connectToStream(snapshot.val());
    }
  });

  // Watch isFired to reset UI when alarm stops  
  onValue(ref(db, `/alarms/${ALARM_UID}/isFired`), (snapshot) => {
    if (!snapshot.val()) {
      if (pc) { pc.close(); pc = null; }
      remoteVideo.style.display = 'none';
      status.textContent = "A aguardar alarme...";
    }
  });
</script>
</body>
</html>
