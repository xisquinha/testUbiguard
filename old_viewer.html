<!DOCTYPE html>
<html>
<head>
    <title>Viewer Node</title>
    <style>
        body { font-family: sans-serif; padding: 16px; background: #111; color: #eee; }
        #log { font-size: 12px; background: #222; padding: 8px; border-radius: 4px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        video { margin-top: 12px; border: 2px solid #0f0; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Viewer Node</h2>
    <p>Status: <span id="status">A aguardar alarme...</span></p>
    <video id="remoteVideo" autoplay playsinline style="width:100%; max-width:500px; display:none;" controls muted></video>
    <pre id="log"></pre>

    <script type="module">
        import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded }
                                    from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const app = initializeApp({
            apiKey:      "AIzaSyCY4Hbw2Dhc7HbZovdG_uPPjkfECsMAS98",
            databaseURL: "https://esp-project-adbef-default-rtdb.europe-west1.firebasedatabase.app/"
        });
        const db = getDatabase(app);

        const ALARM_UID   = "alarm_3076F5F04D70";
        const statusEl    = document.getElementById('status');
        const remoteVideo = document.getElementById('remoteVideo');
        const logEl       = document.getElementById('log');

        function log(msg) {
            const ts = new Date().toLocaleTimeString();
            console.log(msg);
            logEl.textContent += `[${ts}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ── ICE / STUN + free TURN servers ──────────────────────────────────
        const servers = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                {
                    urls:       "turn:global.relay.metered.ca:80",
                    username:   "8925165006e017a481028666",
                    credential: "agRZH6av4wFPruzm",
                },
                {
                    urls:       "turn:global.relay.metered.ca:80?transport=tcp",
                    username:   "8925165006e017a481028666",
                    credential: "agRZH6av4wFPruzm",
                },
                {
                    urls:       "turn:global.relay.metered.ca:443",
                    username:   "8925165006e017a481028666",
                    credential: "agRZH6av4wFPruzm",
                },
                {
                    urls:       "turns:global.relay.metered.ca:443?transport=tcp",
                    username:   "8925165006e017a481028666",
                    credential: "agRZH6av4wFPruzm",
                },
            ]
        };

        // ── Firebase paths ───────────────────────────────────────────────────
        const basePath             = `/alarms/${ALARM_UID}`;
        const offerPath            = `${basePath}/webrtc/offer`;
        const answerPath           = `${basePath}/webrtc/answer`;
        const callerCandidatesPath = `${basePath}/webrtc/callerCandidates`;
        const viewerCandidatesPath = `${basePath}/webrtc/viewerCandidates`;

        let pc = null;

        // ── Connect to camera stream ─────────────────────────────────────────
        async function connectToStream(offer) {
            // Clean up any stale connection first
            if (pc) {
                log("Closing stale peer connection before reconnecting");
                pc.close();
                pc = null;
            }

            log("Connecting to camera stream...");
            statusEl.textContent = "🔗 A ligar ao stream...";

            pc = new RTCPeerConnection(servers);

            // Show remote video when track arrives
            pc.ontrack = (event) => {
                log(`Remote track received: ${event.track.kind}`);
                if (event.streams && event.streams[0]) {
                    remoteVideo.style.display = 'block';      // visible BEFORE srcObject
                    remoteVideo.srcObject = event.streams[0];
                    remoteVideo.play()
                        .then(() => {
                            statusEl.textContent = "🔴 Ao vivo";
                            log("Video playing ✅");
                        })
                        .catch(e => {
                            log(`❌ play() blocked: ${e.message}`);
                            statusEl.textContent = "⚠️ Clique para iniciar vídeo";
                            // Fallback: let user tap to unblock autoplay
                            remoteVideo.addEventListener('click', () => remoteVideo.play(), { once: true });
                        });
                }
            };

            pc.oniceconnectionstatechange = () => {
                log(`ICE state: ${pc.iceConnectionState}`);
                if (pc.iceConnectionState === 'failed') {
                    statusEl.textContent = "❌ ICE failed — verifique a rede";
                }
                if (pc.iceConnectionState === 'disconnected') {
                    statusEl.textContent = "⚠️ Stream desligado";
                }
            };
            pc.onconnectionstatechange = () => {
                log(`Connection state: ${pc.connectionState}`);
            };

            // Send our ICE candidates to Firebase
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    log(`Sending viewer ICE candidate: ${event.candidate.type}`);
                    push(ref(db, viewerCandidatesPath), event.candidate.toJSON());
                }
            };

            // Apply the offer from the camera
            log("Applying remote description (offer)...");
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            log("Remote description (offer) set ✅");

            // Create and send our answer
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            log("Local description (answer) set ✅");

            await set(ref(db, answerPath), { type: answer.type, sdp: answer.sdp });
            log("Answer pushed to Firebase ✅");

            // ─────────────────────────────────────────────────────────────────
            // Now it is safe to add the camera's ICE candidates because
            // setRemoteDescription() has already been called above.
            // onChildAdded delivers any children already in Firebase instantly.
            // ─────────────────────────────────────────────────────────────────
            onChildAdded(ref(db, callerCandidatesPath), (snapshot) => {
                if (!snapshot.val()) return;
                log(`Adding caller ICE candidate: ${snapshot.val().type || 'unknown'}`);
                pc.addIceCandidate(new RTCIceCandidate(snapshot.val()))
                  .catch(e => log(`addIceCandidate error: ${e.message}`));
            });
        }

        // ── Watch for alarm cleared ──────────────────────────────────────────
        onValue(ref(db, `${basePath}/isFired`), (snapshot) => {
            if (!snapshot.val()) {
                log("Alarm cleared — resetting viewer");
                if (pc) { pc.close(); pc = null; }
                remoteVideo.style.display = 'none';
                remoteVideo.srcObject = null;
                statusEl.textContent = "A aguardar alarme...";
            }
        });

        // ── Watch for WebRTC offer from camera ───────────────────────────────
        // onValue fires immediately with the current value, and again on change.
        // We drop the !pc guard so we properly reconnect if the camera restarts.
        onValue(ref(db, offerPath), (snapshot) => {
            const offer = snapshot.val();
            if (!offer) {
                log("No offer in Firebase yet");
                return;
            }
            // Only connect if we're not already stable/connected
            if (pc && (pc.signalingState === 'stable' || pc.connectionState === 'connected')) {
                log("Already connected — ignoring new offer");
                return;
            }
            log("Offer detected in Firebase — initiating connection");
            connectToStream(offer).catch(err => {
                log(`❌ connectToStream error: ${err.message}`);
                statusEl.textContent = `❌ Erro: ${err.message}`;
            });
        });
    </script>
</body>
</html>
